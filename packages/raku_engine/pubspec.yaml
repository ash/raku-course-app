name: raku_engine
description: "The Raku++ interpreter, compiled into the app and called through dart:ffi."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.8.1
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
