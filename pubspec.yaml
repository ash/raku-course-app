name: course_of_raku
description: "Course of Raku — learn the Raku programming language, offline."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  raku_engine:
    path: packages/raku_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#2A52BE"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/content.json
    - assets/data/examples.json
    - assets/images/
